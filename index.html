<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал мини-игр</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .game-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            background-color: #fafafa;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .game-card h2 {
            margin-top: 0;
            color: #e74c3c;
        }
        canvas {
            background-color: #000;
            display: block;
            margin: 10px auto;
            border-radius: 5px;
            cursor: pointer;
        }
        .controls {
            text-align: center;
            margin-top: 10px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 2px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 60px;
            text-align: center;
        }
        .settings-panel {
            background-color: #e8f4fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .settings-panel label {
            margin: 0 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Портал мини-игр</h1>
    <p>Выберите игру ниже, чтобы начать играть прямо в браузере.</p>

    <div class="games-grid">

        <!-- Игра 1: Крестики-нолики -->
        <div class="game-card">
            <h2>Крестики-нолики</h2>
            <canvas id="ticTacToe" width="200" height="200"></canvas>
            <div class="controls">
                <p id="tttStatus">Ваш ход (X)</p>
                <button onclick="resetTicTacToe()">Новая игра</button>
            </div>
        </div>

        <!-- Игра 2: Угадай число -->
        <div class="game-card">
            <h2>Угадай число (1-100)</h2>
            <p id="numberGuessStatus">Я загадал число от 1 до 100. Попробуйте угадать!</p>
            <div class="controls">
                <input type="number" id="numberGuessInput" min="1" max="100">
                <button onclick="checkNumberGuess()">Проверить</button>
                <button onclick="newNumberGame()">Новая игра</button>
            </div>
        </div>

        <!-- Игра 3: Змейка -->
        <div class="game-card">
            <h2>Змейка</h2>
            <canvas id="snakeGame" width="300" height="300"></canvas>
            <div class="controls">
                <p id="snakeScore">Счет: 0</p>
                <button onclick="startSnakeGame()">Начать</button>
            </div>
        </div>

        <!-- Игра 4: Сапер -->
        <div class="game-card">
            <h2>Сапер</h2>
            <div class="settings-panel">
                <label>Размер поля: 
                    <input type="number" id="mineRows" value="10" min="5" max="20">
                </label>
                <label>Мин: 
                    <input type="number" id="mineCount" value="15" min="10" max="100">
                </label>
                <button onclick="initMinesweeper()">Создать поле</button>
            </div>
            <canvas id="minesweeperCanvas"></canvas>
            <div class="controls">
                <p id="msStatus">Настройте поле и нажмите "Создать поле"</p>
                <button onclick="initMinesweeper()">Новая игра</button>
            </div>
        </div>

    </div>
</div>

<script>
/* === 1. Крестики-нолики === */
const tttCanvas = document.getElementById('ticTacToe');
const tttCtx = tttCanvas.getContext('2d');
const tttStatus = document.getElementById('tttStatus');
const tttBoard = Array(9).fill(null);
let tttCurrentPlayer = 'X';

function drawTicTacToe() {
    tttCtx.clearRect(0, 0, tttCanvas.width, tttCanvas.height);
    tttCtx.lineWidth = 4;
    tttCtx.strokeStyle = '#333';
    tttCtx.beginPath(); tttCtx.moveTo(66, 0); tttCtx.lineTo(66, 200); tttCtx.stroke();
    tttCtx.beginPath(); tttCtx.moveTo(133, 0); tttCtx.lineTo(133, 200); tttCtx.stroke();
    tttCtx.beginPath(); tttCtx.moveTo(0, 66); tttCtx.lineTo(200, 66); tttCtx.stroke();
    tttCtx.beginPath(); tttCtx.moveTo(0, 133); tttCtx.lineTo(200, 133); tttCtx.stroke();
    tttBoard.forEach((val, index) => {
        const x = (index % 3) * 66 + 33;
        const y = Math.floor(index / 3) * 66 + 33;
        if (val === 'X') {
            tttCtx.lineWidth = 6;
            tttCtx.strokeStyle = '#e74c3c';
            tttCtx.beginPath(); tttCtx.moveTo(x - 20, y - 20); tttCtx.lineTo(x + 20, y + 20); tttCtx.stroke();
            tttCtx.beginPath(); tttCtx.moveTo(x + 20, y - 20); tttCtx.lineTo(x - 20, y + 20); tttCtx.stroke();
        } else if (val === 'O') {
            tttCtx.lineWidth = 6;
            tttCtx.strokeStyle = '#3498db';
            tttCtx.beginPath(); tttCtx.arc(x, y, 25, 0, Math.PI * 2); tttCtx.stroke();
        }
    });
}
tttCanvas.addEventListener('click', (e) => {
    const rect = tttCanvas.getBoundingClientRect();
    const col = Math.floor((e.clientX - rect.left) / 66);
    const row = Math.floor((e.clientY - rect.top) / 66);
    const index = row * 3 + col;
    if (tttBoard[index] || checkTTTWinner()) return;
    tttBoard[index] = tttCurrentPlayer;
    const winner = checkTTTWinner();
    if (winner) {
        tttStatus.textContent = `Победил ${winner}!`;
    } else if (!tttBoard.includes(null)) {
        tttStatus.textContent = `Ничья!`;
    } else {
        tttCurrentPlayer = tttCurrentPlayer === 'X' ? 'O' : 'X';
        tttStatus.textContent = `Ход игрока ${tttCurrentPlayer}`;
    }
    drawTicTacToe();
});
function checkTTTWinner() {
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (let line of lines) {
        const [a,b,c] = line;
        if (tttBoard[a] && tttBoard[a] === tttBoard[b] && tttBoard[a] === tttBoard[c]) {
            return tttBoard[a];
        }
    }
    return null;
}
function resetTicTacToe() {
    tttBoard.fill(null);
    tttCurrentPlayer = 'X';
    tttStatus.textContent = `Ход игрока ${tttCurrentPlayer}`;
    drawTicTacToe();
}

/* === 2. Угадай число === */
let secretNumber;
function newNumberGame() {
    secretNumber = Math.floor(Math.random() * 100) + 1;
    document.getElementById('numberGuessStatus').textContent = 'Я загадал число от 1 до 100.';
    document.getElementById('numberGuessInput').value = '';
    document.getElementById('numberGuessInput').focus();
}
function checkNumberGuess() {
    const guess = parseInt(document.getElementById('numberGuessInput').value);
    const status = document.getElementById('numberGuessStatus');
    if (isNaN(guess) || guess < 1 || guess > 100) {
        status.textContent = 'Введите число от 1 до 100.';
        return;
    }
    if (guess === secretNumber) {
        status.textContent = 'Угадали! Поздравляю!';
    } else if (guess < secretNumber) {
        status.textContent = 'Слишком мало. Попробуйте еще.';
    } else {
        status.textContent = 'Слишком много. Попробуйте еще.';
    }
}

/* === 3. Змейка === */
const snakeCanvas = document.getElementById('snakeGame');
const snakeCtx = snakeCanvas.getContext('2d');
const snakeScore = document.getElementById('snakeScore');
let snake, food, dx, dy, gameInterval;
function startSnakeGame() {
    snake = [{x: 150, y: 150}, {x: 140, y: 150}, {x: 130, y: 150}];
    dx = 10; dy = 0;
    randomFood();
    snakeScore.textContent = 'Счет: 0';
    clearInterval(gameInterval);
    gameInterval = setInterval(mainSnake, 100);
    document.addEventListener('keydown', changeDirectionSnake);
}
function mainSnake() {
    setTimeout(function() {
        clearCanvasSnake();
        drawFoodSnake();
        advanceSnake();
        drawSnake();
        if (gameOverSnake()) {
            clearInterval(gameInterval);
            document.removeEventListener('keydown', changeDirectionSnake);
            alert('Игра окончена! Ваш счет: ' + (snake.length - 3));
        }
    }, 0);
}
function clearCanvasSnake() { snakeCtx.fillStyle = '#000'; snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height); }
function drawSnake() { snakeCtx.fillStyle = '#00FF00'; snake.forEach(part => snakeCtx.fillRect(part.x, part.y, 10, 10)); }
function advanceSnake() {
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        randomFood();
        snakeScore.textContent = 'Счет: ' + (snake.length - 3);
    } else {
        snake.pop();
    }
}
function randomFood() {
    food = {x: Math.floor(Math.random() * 30) * 10, y: Math.floor(Math.random() * 30) * 10};
    if (snake.some(part => part.x === food.x && part.y === food.y)) randomFood();
}
function drawFoodSnake() { snakeCtx.fillStyle = '#FF0000'; snakeCtx.fillRect(food.x, food.y, 10, 10); }
function changeDirectionSnake(e) {
    const LEFT_KEY = 37, RIGHT_KEY = 39, UP_KEY = 38, DOWN_KEY = 40;
    const goingUp = dy === -10; const goingDown = dy === 10;
    const goingLeft = dx === -10; const goingRight = dx === 10;
    if (e.keyCode === LEFT_KEY && !goingRight) { dx = -10; dy = 0; }
    else if (e.keyCode === UP_KEY && !goingDown) { dx = 0; dy = -10; }
    else if (e.keyCode === RIGHT_KEY && !goingLeft) { dx = 10; dy = 0; }
    else if (e.keyCode === DOWN_KEY && !goingUp) { dx = 0; dy = 10; }
}
function gameOverSnake() {
    const head = snake[0];
    const hitLeftWall = head.x < 0; const hitRightWall = head.x > snakeCanvas.width - 10;
    const hitTopWall = head.y < 0; const hitBottomWall = head.y > snakeCanvas.height - 10;
    const hitSelf = snake.slice(1).some(part => part.x === head.x && part.y === head.y);
    return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall || hitSelf;
}

/* === 4. Сапер === */
const msCanvas = document.getElementById('minesweeperCanvas');
const msCtx = msCanvas.getContext('2d');
const msStatus = document.getElementById('msStatus');
let mineField = [], mineRows = 10, mineCols = 10, mineTotal = 15;
let cellSize = 30, revealedCount = 0, gameOver = false;

function initMinesweeper() {
    mineRows = parseInt(document.getElementById('mineRows').value);
    mineTotal = parseInt(document.getElementById('mineCount').value);
    if (mineTotal >= mineRows * mineRows) {
        alert('Мин не может быть больше или равно количеству клеток. Уменьшите количество мин.');
        document.getElementById('mineCount').value = Math.floor(mineRows * mineRows / 2);
        mineTotal = parseInt(document.getElementById('mineCount').value);
    }
    mineCols = mineRows;
    cellSize = Math.min(40, Math.floor(400 / mineRows));
    msCanvas.width = mineCols * cellSize;
    msCanvas.height = mineRows * cellSize;
    
    mineField = Array(mineRows).fill().map(() => Array(mineCols).fill({isMine: false, revealed: false, flagged: false, count: 0}));
    placeMines();
    calculateCounts();
    revealedCount = 0;
    gameOver = false;
    drawMineField();
    msStatus.textContent = `Поле ${mineRows}x${mineRows}. Мин: ${mineTotal}. ЛКМ - открыть, ПКМ - флаг.`;
}

function placeMines() {
    let placed = 0;
    while (placed < mineTotal) {
        const r = Math.floor(Math.random() * mineRows);
        const c = Math.floor(Math.random() * mineCols);
        if (!mineField[r][c].isMine) {
            mineField[r][c].isMine = true;
            placed++;
        }
    }
}

function calculateCounts() {
    for (let r = 0; r < mineRows; r++) {
        for (let c = 0; c < mineCols; c++) {
            if (mineField[r][c].isMine) continue;
            let count = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    const nr = r + i;
                    const nc = c + j;
                    if (nr >= 0 && nr < mineRows && nc >= 0 && nc < mineCols && mineField[nr][nc].isMine) {
                        count++;
                    }
                }
            }
            mineField[r][c].count = count;
        }
    }
}

function drawMineField() {
    msCtx.clearRect(0, 0, msCanvas.width, msCanvas.height);
    for (let r = 0; r < mineRows; r++) {
        for (let c = 0; c < mineCols; c++) {
            const cell = mineField[r][c];
            const x = c * cellSize;
            const y = r * cellSize;
            
            if (cell.revealed) {
                msCtx.fillStyle = cell.isMine ? '#FF4136' : '#eee';
                msCtx.fillRect(x, y, cellSize, cellSize);
                msCtx.strokeStyle = '#999';
                msCtx.strokeRect(x, y, cellSize, cellSize);
                if (!cell.isMine && cell.count > 0) {
                    const colors = ['#444', '#0074D9', '#2ECC40', '#FF4136', '#FF851B', '#7FDBFF', '#39CCCC', '#3D9970', '#001f3f'];
                    msCtx.fillStyle = colors[cell.count];
                    msCtx.font = `${cellSize - 8}px Arial`;
                    msCtx.textAlign = 'center';
                    msCtx.textBaseline = 'middle';
                    msCtx.fillText(cell.count, x + cellSize/2, y + cellSize/2);
                }
            } else {
                msCtx.fillStyle = '#bbb';
                msCtx.fillRect(x, y, cellSize, cellSize);
                msCtx.strokeStyle = '#999';
                msCtx.strokeRect(x, y, cellSize, cellSize);
                if (cell.flagged) {
                    msCtx.fillStyle = '#FFDC00';
                    msCtx.beginPath();
                    msCtx.moveTo(x + cellSize/2, y + 5);
                    msCtx.lineTo(x + cellSize - 5, y + cellSize/2);
                    msCtx.lineTo(x + cellSize/2, y + cellSize - 5);
                    msCtx.fill();
                }
            }
        }
    }
}

msCanvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (gameOver) return;
    const rect = msCanvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / cellSize);
    const r = Math.floor((e.clientY - rect.top) / cellSize);
    if (!mineField[r][c].revealed) {
        mineField[r][c].flagged = !mineField[r][c].flagged;
        drawMineField();
    }
});

msCanvas.addEventListener('click', (e) => {
    if (gameOver) return;
    const rect = msCanvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / cellSize);
    const r = Math.floor((e.clientY - rect.top) / cellSize);
    const cell = mineField[r][c];
    if (cell.flagged || cell.revealed) return;
    
    cell.revealed = true;
    revealedCount++;
    
    if (cell.isMine) {
        gameOver = true;
        revealAllMines();
        msStatus.textContent = 'Вы наступили на мину! Игра окончена.';
        drawMineField();
        return;
    }
    
    if (cell.count === 0) {
        floodFill(r, c);
    }
    
    if (revealedCount === mineRows * mineCols - mineTotal) {
        gameOver = true;
        msStatus.textContent = 'Победа! Все клетки открыты!';
    }
    drawMineField();
});

function floodFill(r, c) {
    if (r < 0 || r >= mineRows || c < 0 || c >= mineCols) return;
    const cell = mineField[r][c];
    if (cell.revealed || cell.isMine) return;
    
    cell.revealed = true;
    revealedCount++;
    
    if (cell.count === 0) {
        for (let i = -1; i <= 1; i++) {
            for (let j = -1; j <= 1; j++) {
                floodFill(r + i, c + j);
            }
        }
    }
}

function revealAllMines() {
    for (let r = 0; r < mineRows; r++) {
        for (let c = 0; c < mineCols; c++) {
            if (mineField[r][c].isMine) {
                mineField[r][c].revealed = true;
            }
        }
    }
}

/* === Инициализация === */
drawTicTacToe();
newNumberGame();
startSnakeGame();
initMinesweeper();
</script>

</body>
</html>
