<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гонки на чистом JS</title>
    <style>
        body { 
            margin: 0; 
            background: #87CEEB; /* Небесно-голубой фон */
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            perspective: 500px;
        }
        /* Дорога */
        #road {
            position: absolute;
            width: 100%;
            height: 200%;
            background: #333;
            transform-origin: top;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.5);
        }
        /* Разметка дороги */
        .line {
            position: absolute;
            width: 6px;
            height: 80px;
            background: #FFF;
            left: 50%;
            margin-left: -3px;
            border-radius: 3px;
        }
        /* Машина игрока */
        #player {
            position: absolute;
            bottom: 50px;
            left: 50%;
            width: 40px;
            height: 80px;
            background: red;
            transform: translateX(-50%);
            border: 3px solid #000;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255,0,0,0.5);
        }
        /* Противники */
        .enemy {
            position: absolute;
            width: 40px;
            height: 80px;
            background: blue;
            border: 3px solid #000;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,255,0.5);
        }
        /* Интерфейс */
        #ui {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="game-container">
    <div id="road"></div>
    <div id="player"></div>
    <div id="ui">
        <div>Скорость: <span id="speed">0</span> км/ч</div>
        <div>Расстояние: <span id="distance">0</span> м</div>
    </div>
</div>

<script>
    const player = document.getElementById('player');
    const road = document.getElementById('road');
    const speedSpan = document.getElementById('speed');
    const distanceSpan = document.getElementById('distance');

    let gameSpeed = 4;
    let playerX = 50; // Позиция игрока в процентах (50% - центр)
    let distance = 0;
    let enemies = [];
    let keys = {ArrowLeft: false, ArrowRight: false};

    // Создаем разметку дороги
    for(let i = 0; i < 100; i++) {
        const line = document.createElement('div');
        line.classList.add('line');
        line.style.top = (i * 80) + 'px';
        road.appendChild(line);
    }

    // Управление
    window.addEventListener('keydown', (e) => {
        if(e.key in keys) keys[e.key] = true;
    });
    window.addEventListener('keyup', (e) => {
        if(e.key in keys) keys[e.key] = false;
    });

    function spawnEnemy() {
        const enemy = document.createElement('div');
        enemy.classList.add('enemy');
        // Случайная полоса: левая (20%), центральная (50%) или правая (80%)
        const lanes = [20, 50, 80];
        const lane = lanes[Math.floor(Math.random() * lanes.length)];
        enemy.style.left = lane + '%';
        enemy.style.top = '-100px';
        document.getElementById('game-container').appendChild(enemy);
        enemies.push({elem: enemy, lane: lane, speed: gameSpeed + Math.random() * 2});
    }

    function gameLoop() {
        // Управление машиной
        if(keys['ArrowLeft'] && playerX > 20) playerX -= 0.5;
        if(keys['ArrowRight'] && playerX < 80) playerX += 0.5;
        player.style.left = playerX + '%';

        // Движение дороги (имитация скорости)
        road.style.transform = `translateY(-${distance}px) rotateX(10deg)`;
        
        // Каждые 50 пикселей пройденного пути увеличиваем скорость
        if(distance % 50 === 0) {
            gameSpeed += 0.05;
        }
        distance += gameSpeed;
        distanceSpan.textContent = Math.floor(distance);
        speedSpan.textContent = Math.floor(gameSpeed * 15); // Визуальная скорость

        // Движение и спавн противников
        if(distance % 100 === 0) {
            spawnEnemy();
        }

        enemies.forEach((enemy, index) => {
            enemy.elem.style.top = (parseInt(enemy.elem.style.top || '-100') + enemy.speed) + 'px';
            enemy.speed = gameSpeed + Math.random() * 2;

            // Проверка столкновения
            const playerRect = player.getBoundingClientRect();
            const enemyRect = enemy.elem.getBoundingClientRect();
            if(!(playerRect.right < enemyRect.left || 
                 playerRect.left > enemyRect.right || 
                 playerRect.bottom < enemyRect.top || 
                 playerRect.top > enemyRect.bottom)) {
                // Столкновение
                player.style.background = 'gray';
                gameSpeed = 0;
                alert('Авария! Вы проехали ' + Math.floor(distance) + ' метров. Обновите страницу для реванша.');
            }

            // Удаление врагов, которые уехали за экран
            if(parseInt(enemy.elem.style.top) > window.innerHeight + 100) {
                enemy.elem.remove();
                enemies.splice(index, 1);
            }
        });

        requestAnimationFrame(gameLoop);
    }

    // Запуск игры
    gameLoop();
</script>
</body>
</html>
