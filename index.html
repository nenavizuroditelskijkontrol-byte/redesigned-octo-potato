<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал мини-игр</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .game-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            background-color: #fafafa;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .game-card h2 {
            margin-top: 0;
            color: #e74c3c;
        }
        canvas {
            background-color: #000;
            display: block;
            margin: 10px auto;
            border-radius: 5px;
        }
        .controls {
            text-align: center;
            margin-top: 10px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Портал мини-игр</h1>
    <p>Выберите игру ниже, чтобы начать играть прямо в браузере.</p>

    <div class="games-grid">

        <!-- Игра 1: Крестики-нолики -->
        <div class="game-card">
            <h2>Крестики-нолики</h2>
            <canvas id="ticTacToe" width="200" height="200"></canvas>
            <div class="controls">
                <p id="tttStatus">Ваш ход (X)</p>
                <button onclick="resetTicTacToe()">Новая игра</button>
            </div>
        </div>

        <!-- Игра 2: Угадай число -->
        <div class="game-card">
            <h2>Угадай число (1-100)</h2>
            <p id="numberGuessStatus">Я загадал число от 1 до 100. Попробуйте угадать!</p>
            <div class="controls">
                <input type="number" id="numberGuessInput" min="1" max="100">
                <button onclick="checkNumberGuess()">Проверить</button>
                <button onclick="newNumberGame()">Новая игра</button>
            </div>
        </div>

        <!-- Игра 3: Змейка -->
        <div class="game-card">
            <h2>Змейка</h2>
            <canvas id="snakeGame" width="300" height="300"></canvas>
            <div class="controls">
                <p id="snakeScore">Счет: 0</p>
                <button onclick="startSnakeGame()">Начать</button>
            </div>
        </div>

    </div>
</div>

<script>
/* === 1. Крестики-нолики === */
const tttCanvas = document.getElementById('ticTacToe');
const tttCtx = tttCanvas.getContext('2d');
const tttStatus = document.getElementById('tttStatus');
const tttBoard = Array(9).fill(null);
let tttCurrentPlayer = 'X';

function drawTicTacToe() {
    tttCtx.clearRect(0, 0, tttCanvas.width, tttCanvas.height);
    tttCtx.lineWidth = 4;
    tttCtx.strokeStyle = '#333';
    // Линии поля
    tttCtx.beginPath(); tttCtx.moveTo(66, 0); tttCtx.lineTo(66, 200); tttCtx.stroke();
    tttCtx.beginPath(); tttCtx.moveTo(133, 0); tttCtx.lineTo(133, 200); tttCtx.stroke();
    tttCtx.beginPath(); tttCtx.moveTo(0, 66); tttCtx.lineTo(200, 66); tttCtx.stroke();
    tttCtx.beginPath(); tttCtx.moveTo(0, 133); tttCtx.lineTo(200, 133); tttCtx.stroke();
    // Фигуры
    tttBoard.forEach((val, index) => {
        const x = (index % 3) * 66 + 33;
        const y = Math.floor(index / 3) * 66 + 33;
        if (val === 'X') {
            tttCtx.lineWidth = 6;
            tttCtx.strokeStyle = '#e74c3c';
            tttCtx.beginPath(); tttCtx.moveTo(x - 20, y - 20); tttCtx.lineTo(x + 20, y + 20); tttCtx.stroke();
            tttCtx.beginPath(); tttCtx.moveTo(x + 20, y - 20); tttCtx.lineTo(x - 20, y + 20); tttCtx.stroke();
        } else if (val === 'O') {
            tttCtx.lineWidth = 6;
            tttCtx.strokeStyle = '#3498db';
            tttCtx.beginPath();
            tttCtx.arc(x, y, 25, 0, Math.PI * 2);
            tttCtx.stroke();
        }
    });
}

tttCanvas.addEventListener('click', (e) => {
    const rect = tttCanvas.getBoundingClientRect();
    const col = Math.floor((e.clientX - rect.left) / 66);
    const row = Math.floor((e.clientY - rect.top) / 66);
    const index = row * 3 + col;
    if (tttBoard[index] || checkTTTWinner()) return;
    tttBoard[index] = tttCurrentPlayer;
    const winner = checkTTTWinner();
    if (winner) {
        tttStatus.textContent = `Победил ${winner}!`;
    } else if (!tttBoard.includes(null)) {
        tttStatus.textContent = `Ничья!`;
    } else {
        tttCurrentPlayer = tttCurrentPlayer === 'X' ? 'O' : 'X';
        tttStatus.textContent = `Ход игрока ${tttCurrentPlayer}`;
    }
    drawTicTacToe();
});

function checkTTTWinner() {
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (let line of lines) {
        const [a,b,c] = line;
        if (tttBoard[a] && tttBoard[a] === tttBoard[b] && tttBoard[a] === tttBoard[c]) {
            return tttBoard[a];
        }
    }
    return null;
}

function resetTicTacToe() {
    tttBoard.fill(null);
    tttCurrentPlayer = 'X';
    tttStatus.textContent = `Ход игрока ${tttCurrentPlayer}`;
    drawTicTacToe();
}

/* === 2. Угадай число === */
let secretNumber;
function newNumberGame() {
    secretNumber = Math.floor(Math.random() * 100) + 1;
    document.getElementById('numberGuessStatus').textContent = 'Я загадал число от 1 до 100.';
    document.getElementById('numberGuessInput').value = '';
    document.getElementById('numberGuessInput').focus();
}
function checkNumberGuess() {
    const guess = parseInt(document.getElementById('numberGuessInput').value);
    const status = document.getElementById('numberGuessStatus');
    if (isNaN(guess) || guess < 1 || guess > 100) {
        status.textContent = 'Введите число от 1 до 100.';
        return;
    }
    if (guess === secretNumber) {
        status.textContent = 'Угадали! Поздравляю!';
    } else if (guess < secretNumber) {
        status.textContent = 'Слишком мало. Попробуйте еще.';
    } else {
        status.textContent = 'Слишком много. Попробуйте еще.';
    }
}

/* === 3. Змейка === */
const snakeCanvas = document.getElementById('snakeGame');
const snakeCtx = snakeCanvas.getContext('2d');
const snakeScore = document.getElementById('snakeScore');
let snake, food, dx, dy, gameInterval;

function startSnakeGame() {
    snake = [{x: 150, y: 150}, {x: 140, y: 150}, {x: 130, y: 150}];
    dx = 10; dy = 0;
    randomFood();
    snakeScore.textContent = 'Счет: 0';
    clearInterval(gameInterval);
    gameInterval = setInterval(mainSnake, 100);
    document.addEventListener('keydown', changeDirectionSnake);
}

function mainSnake() {
    setTimeout(function() {
        clearCanvasSnake();
        drawFoodSnake();
        advanceSnake();
        drawSnake();
        if (gameOverSnake()) {
            clearInterval(gameInterval);
            document.removeEventListener('keydown', changeDirectionSnake);
            alert('Игра окончена! Ваш счет: ' + (snake.length - 3));
        }
    }, 0);
}

function clearCanvasSnake() { snakeCtx.fillStyle = '#000'; snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height); }
function drawSnake() { snakeCtx.fillStyle = '#00FF00'; snake.forEach(part => snakeCtx.fillRect(part.x, part.y, 10, 10)); }
function advanceSnake() {
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        randomFood();
        snakeScore.textContent = 'Счет: ' + (snake.length - 3);
    } else {
        snake.pop();
    }
}
function randomFood() {
    food = {
        x: Math.floor(Math.random() * 30) * 10,
        y: Math.floor(Math.random() * 30) * 10
    };
    if (snake.some(part => part.x === food.x && part.y === food.y)) {
        randomFood();
    }
}
function drawFoodSnake() { snakeCtx.fillStyle = '#FF0000'; snakeCtx.fillRect(food.x, food.y, 10, 10); }
function changeDirectionSnake(e) {
    const LEFT_KEY = 37, RIGHT_KEY = 39, UP_KEY = 38, DOWN_KEY = 40;
    const goingUp = dy === -10; const goingDown = dy === 10;
    const goingLeft = dx === -10; const goingRight = dx === 10;
    if (e.keyCode === LEFT_KEY && !goingRight) { dx = -10; dy = 0; }
    else if (e.keyCode === UP_KEY && !goingDown) { dx = 0; dy = -10; }
    else if (e.keyCode === RIGHT_KEY && !goingLeft) { dx = 10; dy = 0; }
    else if (e.keyCode === DOWN_KEY && !goingUp) { dx = 0; dy = 10; }
}
function gameOverSnake() {
    const head = snake[0];
    const hitLeftWall = head.x < 0; const hitRightWall = head.x > snakeCanvas.width - 10;
    const hitTopWall = head.y < 0; const hitBottomWall = head.y > snakeCanvas.height - 10;
    const hitSelf = snake.slice(1).some(part => part.x === head.x && part.y === head.y);
    return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall || hitSelf;
}

/* === Инициализация === */
drawTicTacToe();
newNumberGame();
</script>

</body>
</html>
